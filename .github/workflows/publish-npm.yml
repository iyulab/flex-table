name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    uses: iyulab/shared/.github/workflows/publish-npm.yml@01f35dbbe1e06b30e3c940e78858dd5d805a9444
    with:
      node_version: "24"
      verify_command: node .github/scripts/verify-packed.mjs
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
